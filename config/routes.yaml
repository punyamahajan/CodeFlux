circuit_breaker:
  failure_threshold: 3
  cooldown_seconds: 30

provider_base_urls:
  # Use http://ollama:11434/v1 when CodeFlux itself runs in Docker Compose.
  ollama: http://localhost:11434/v1

# Any model name that is not a route alias or a candidate model below
# (for example "gpt-4" or "gemini-pro") is served by these routes.
default_route: gemini-tier
default_embedding_route: embeddings

routes:
  gpt-4-tier:
    strategy: priority
    total_timeout_seconds: 420
    pii_redaction: false
    candidates:
      - provider: openai
        model: gpt-4o-mini
        api_key_ref: openai-primary
        timeout_seconds: 15
      - provider: groq
        model: llama-3.3-70b-versatile
        api_key_ref: groq-primary
        timeout_seconds: 15
      - provider: gemini
        model: gemini-3.1-flash-lite
        api_key_ref: gemini-primary
        timeout_seconds: 15
      - provider: gemini
        model: gemini-flash-latest
        api_key_ref: gemini-primary
        timeout_seconds: 15
    # Coding model: llama3.2 (3B) could not produce working multi-file apps.
    ollama_fallback_model: qwen2.5-coder
    ollama_fallback_timeout_seconds: 360

  gemini-tier:
    strategy: priority
    total_timeout_seconds: 420
    candidates:
      - provider: gemini
        model: gemini-3.1-flash-lite
        api_key_ref: gemini-primary
        timeout_seconds: 15
      - provider: groq
        model: llama-3.3-70b-versatile
        api_key_ref: groq-primary
        timeout_seconds: 15
      - provider: gemini
        model: gemini-flash-latest
        api_key_ref: gemini-primary
        timeout_seconds: 15
      - provider: openai
        model: gpt-4o-mini
        api_key_ref: openai-primary
        timeout_seconds: 15
      - provider: openrouter
        model: google/gemini-2.0-flash-001
        api_key_ref: openrouter-primary
    # Coding model: llama3.2 (3B) could not produce working multi-file apps.
    ollama_fallback_model: qwen2.5-coder
    ollama_fallback_timeout_seconds: 360

  embeddings:
    strategy: round-robin
    candidates:
      - provider: openai
        model: text-embedding-3-small
        api_key_ref: openai-primary
