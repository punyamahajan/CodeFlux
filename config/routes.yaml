circuit_breaker:
  failure_threshold: 3
  cooldown_seconds: 30

provider_base_urls:
  # Use http://ollama:11434/v1 when CodeFlux itself runs in Docker Compose.
  ollama: http://localhost:11434/v1

# Any model name that is not a route alias or a candidate model below
# (for example "gpt-4" or "gemini-pro") is served by these routes.
default_route: smart
default_embedding_route: embeddings

routes:
  fast:
    strategy: least-latency
    total_timeout_seconds: 60
    candidates:
      - provider: groq
        model: qwen/qwen3.8-27b
        api_key_ref: groq-primary
        timeout_seconds: 15
      - provider: gemini
        model: gemini-2.5-flash-lite
        api_key_ref: gemini-primary
        timeout_seconds: 15
      - provider: openai
        model: gpt-4o-mini
        api_key_ref: openai-primary
        timeout_seconds: 15

  smart:
    strategy: priority
    total_timeout_seconds: 120
    candidates:
      - provider: gemini
        model: gemini-2.5-flash-lite
        api_key_ref: gemini-primary
        timeout_seconds: 15
      - provider: groq
        model: qwen/qwen3.8-27b
        api_key_ref: groq-primary
        timeout_seconds: 15
      - provider: openai
        model: gpt-4o-mini
        api_key_ref: openai-primary
        timeout_seconds: 15

  code:
    strategy: priority
    total_timeout_seconds: 180
    candidates:
      - provider: groq
        model: qwen/qwen3.8-27b
        api_key_ref: groq-primary
        timeout_seconds: 15
      - provider: gemini
        model: gemini-2.5-flash-lite
        api_key_ref: gemini-primary
        timeout_seconds: 15
      - provider: ollama
        model: qwen2.5-coder
        timeout_seconds: 30

  groq-tier:
    strategy: priority
    total_timeout_seconds: 60
    candidates:
      - provider: groq
        model: qwen/qwen3.8-27b
        api_key_ref: groq-primary
        timeout_seconds: 15

  gpt-4-tier:
    strategy: priority
    total_timeout_seconds: 420
    candidates:
      - provider: openai
        model: gpt-4o-mini
        api_key_ref: openai-primary
        timeout_seconds: 15
      - provider: groq
        model: qwen/qwen3.8-27b
        api_key_ref: groq-primary
        timeout_seconds: 15

  gemini-tier:
    strategy: priority
    total_timeout_seconds: 420
    candidates:
      - provider: gemini
        model: gemini-2.5-flash-lite
        api_key_ref: gemini-primary
        timeout_seconds: 15
      - provider: groq
        model: qwen/qwen3.8-27b
        api_key_ref: groq-primary
        timeout_seconds: 15

  embeddings:
    strategy: round-robin
    candidates:
      - provider: openai
        model: text-embedding-3-small
        api_key_ref: openai-primary
