[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeflux"
version = "0.1.0"
description = "Self-hosted multi-provider LLM proxy and failover gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "cryptography>=43.0",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "prometheus-client>=0.20",
  "python-json-logger>=2.0",
  "streamlit>=1.57",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["codeflux"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
