[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeflux"
version = "0.1.0"
description = "OmniKey - Unified AI gateway for teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "locust>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["codeflux"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
